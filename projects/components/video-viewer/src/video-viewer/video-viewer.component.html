<button #triggerEl type="button" class="vv-trigger" [attr.aria-label]="label()" (click)="_show()">
  @if (_thumbnail()) {
    <img class="vv-thumb" [src]="_thumbnail()" alt="" loading="lazy">
  } @else if (_videoType() === 'mp4' && src()) {
    <video class="vv-thumb" [src]="src() + '#t=0.5'" preload="metadata" muted playsinline aria-hidden="true" tabindex="-1"></video>
  }
  <span class="vv-play" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>
  </span>
  @if (_videoType() !== 'mp4') {
    <span class="vv-badge">{{ _videoType() === 'youtube' ? 'YouTube' : 'Vimeo' }}</span>
  }
</button>

@if (_open()) {
  <div class="vv-backdrop" (click)="_close()">
    <div #playerEl class="vv-player" role="dialog" aria-modal="true" [attr.aria-label]="label()"
         (click)="$event.stopPropagation()">
      <button #closeBtn type="button" class="vv-close" (click)="_close()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>

      @if (_videoType() === 'mp4') {
        <video
          #videoEl
          class="vv-video"
          [src]="src()"
          [poster]="poster()"
          [muted]="_muted()"
          autoplay
          playsinline
          (timeupdate)="_onTimeUpdate($event)"
          (loadedmetadata)="_onTimeUpdate($event)"
          (play)="_playing.set(true)"
          (pause)="_playing.set(false)"
          (click)="_togglePlay()"
        ></video>
        <div class="vv-controls">
          <button type="button" class="vv-btn" (click)="_togglePlay()" [attr.aria-label]="_playing() ? 'Pause' : 'Play'">
            @if (_playing()) {
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 19 12 6 20 6 4"/></svg>
            }
          </button>
          <span class="vv-time">{{ _formatTime(_currentTime()) }} / {{ _formatTime(_duration()) }}</span>
          <input
            type="range" class="vv-seek" min="0" max="100" step="0.1"
            aria-label="Seek"
            [value]="_progress()"
            (input)="_onSeek($event)"
          />
          <button type="button" class="vv-btn" (click)="_toggleMute()" [attr.aria-label]="_muted() ? 'Unmute' : 'Mute'">
            @if (_muted()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            }
          </button>
          <button type="button" class="vv-btn" (click)="_fullscreen()" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      } @else if (_embedUrl()) {
        <iframe
          class="vv-embed"
          [src]="_embedUrl()"
          [title]="label()"
          allowfullscreen
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        ></iframe>
      }
    </div>
  </div>
}
