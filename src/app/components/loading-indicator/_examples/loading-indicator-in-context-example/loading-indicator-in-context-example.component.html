<div class="flex flex-col items-start gap-4">
  <button mat-flat-button (click)="load()" [disabled]="loading()">Refresh</button>
  <div class="flex h-40 w-full max-w-md items-center justify-center rounded-xl border border-dashed border-outline-variant">
    @if (loading()) {
      <emr-loading-indicator contained aria-label="Refreshing content" />
    } @else {
      <span class="text-sm text-on-surface-variant">Content loaded. Press refresh to reload.</span>
    }
  </div>
</div>
