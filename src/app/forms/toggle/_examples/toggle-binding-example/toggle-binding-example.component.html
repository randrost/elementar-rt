<div class="flex flex-wrap items-center gap-4">
  <button emrToggle variant="tonal" [(pressed)]="muted">
    <mat-icon>{{ muted() ? 'volume_off' : 'volume_up' }}</mat-icon>
    {{ muted() ? 'Muted' : 'Mute' }}
  </button>
  <span class="text-sm text-on-surface-variant">pressed: {{ muted() }}</span>
</div>
